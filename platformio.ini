[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
build_flags = -I include
lib_ldf_mode = chain+

lib_deps =
    marcoschwartz/LiquidCrystal_I2C
    Chris--A/Keypad